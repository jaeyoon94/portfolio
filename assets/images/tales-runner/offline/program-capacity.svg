<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 345" role="img" aria-label="프로그램별 유료 좌석: 대회 600석, 뷰잉 200석, 개발자 대화 240석"><style>text{font-family:'Malgun Gothic',sans-serif;fill:#233d50;font-size:18px}.small{font-size:15px;fill:#536c7b}.bold{font-weight:700}</style><rect width="900" height="345" rx="20" fill="#f3f8fb"/><text x="32" y="40" class="small">사전 기획 기준 · 유료 프로그램 정원 · 3일 합계</text><text x="32" y="83" class="bold">대회 관람</text><rect x="225" y="60" width="450" height="32" rx="6" fill="#2584b5"/><text x="690" y="83" class="bold">600석</text><text x="225" y="115" class="small">300석 × 2회</text><text x="32" y="159" class="bold">뷰잉 파티</text><rect x="225" y="136" width="150" height="32" rx="6" fill="#ef795d"/><text x="390" y="159" class="bold">200석</text><text x="225" y="191" class="small">100석 × 2회</text><text x="32" y="235" class="bold">개발자와의 대화</text><rect x="225" y="212" width="180" height="32" rx="6" fill="#62ac98"/><text x="420" y="235" class="bold">240석</text><text x="225" y="267" class="small">60석 × 4회</text><text x="32" y="316" class="small">합계 1,040석 · 프로그램 중복 예매 가능 / 순방문객 목표 600명과 구분</text></svg>